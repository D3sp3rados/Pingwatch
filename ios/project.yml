# Xcode-Projekt erzeugen:  brew install xcodegen && cd ios && xcodegen
# Danach PingWatch.xcodeproj öffnen, unter Signing & Capabilities das Team wählen.
name: PingWatch
options:
  bundleIdPrefix: de.rst
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Team-ID hier eintragen oder in Xcode wählen
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PingWatch:
    type: application
    platform: iOS
    sources:
      - path: PingWatch
      - path: Shared
    entitlements:
      path: PingWatch/PingWatch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.de.rst.pingwatch
    info:
      path: PingWatch/Info.plist
      properties:
        CFBundleDisplayName: PingWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rst.pingwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PingWatchWidget
        embed: true
  PingWatchWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PingWatchWidget
      - path: Shared
    entitlements:
      path: PingWatchWidget/PingWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.rst.pingwatch
    info:
      path: PingWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: PingWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rst.pingwatch.widget
        SKIP_INSTALL: YES
