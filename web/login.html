<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PingWacht – Anmelden</title>
<link rel="icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PingWacht"><meta name="theme-color" content="#0b1120">
<style>
:root{--bg:#f3f5f9;--card:#fff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#059669}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111a2e;--fg:#e2e8f0;--mut:#8b9ab4;--line:#1e2a44;--acc:#34d399}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:340px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-weight:700;font-size:20px}
img{width:36px;height:36px}label{font-size:13px;color:var(--mut)}
input{width:100%;margin:6px 0 16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px}
button{width:100%;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#04130c;font-weight:600;font-size:15px;cursor:pointer}
.err{color:#ef4444;font-size:13px;margin:-8px 0 12px;display:none}
</style></head><body>
<form method="post" action="/login">
<div class="brand"><img src="/icon.svg" alt=""><span>Ping<span style="color:var(--acc)">Wacht</span></span></div>
<div id="cred"><label for="em">E-Mail</label>
<input id="em" name="email" type="text" inputmode="email" autocapitalize="none" autocomplete="username" placeholder="name@firma.de" required>
<label for="pw">Passwort</label>
<input id="pw" name="password" type="password" autocomplete="current-password" required></div>
<div id="tfa" style="display:none"><input type="hidden" name="step" value="2fa"><label for="code">Zwei-Faktor-Code</label>
<input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-stelliger Code aus der Authenticator-App"></div>
<div class="err" id="err">E-Mail oder Passwort falsch.</div>
<button type="submit">Anmelden</button>
<div style="font-size:12px;color:var(--mut);margin-top:10px;text-align:center">Nach 5 Fehlversuchen ist die Anmeldung 15 Minuten gesperrt.</div>
<div id="su" style="display:none;margin-top:14px;font-size:13px;text-align:center;color:var(--mut)">Noch kein Konto? <a href="/signup" style="color:var(--acc)">Kostenlos registrieren</a></div>
<p style="text-align:center;font-size:12px;margin:16px 0 0"><a href="/impressum" style="color:var(--mut)">Impressum</a> · <a href="/datenschutz" style="color:var(--mut)">Datenschutz</a></p>
</form>
<script>const q=new URLSearchParams(location.search); if(q.get('f')){ const e=document.getElementById('err'); e.style.display='block'; if(q.get('m')) e.textContent=q.get('m'); }
if(q.get('step')==='2fa'){ document.getElementById('cred').remove(); document.getElementById('tfa').style.display='block'; document.getElementById('code').required=true; document.getElementById('code').focus(); }
else { document.getElementById('tfa').remove(); document.getElementById('em').focus(); }
fetch('/api/plans').then(r=>r.json()).then(d=>{ if(d.provider&&d.provider.signup==='true') document.getElementById('su').style.display='block'; }).catch(()=>{});</script>
</body></html>
