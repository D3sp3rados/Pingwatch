<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PingWatch – Anmelden</title>
<link rel="icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PingWatch"><meta name="theme-color" content="#0b1120">
<style>
:root{--bg:#f3f5f9;--card:#fff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#059669}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111a2e;--fg:#e2e8f0;--mut:#8b9ab4;--line:#1e2a44;--acc:#34d399}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:340px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-weight:700;font-size:20px}
img{width:36px;height:36px}label{font-size:13px;color:var(--mut)}
input{width:100%;margin:6px 0 16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px}
button{width:100%;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#04130c;font-weight:600;font-size:15px;cursor:pointer}
.err{color:#ef4444;font-size:13px;margin:-8px 0 12px;display:none}
</style></head><body>
<form method="post" action="/login">
<div class="brand"><img src="/icon.svg" alt="">PingWatch</div>
<label for="pw">Passwort</label>
<input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
<div class="err" id="err">Passwort falsch.</div>
<button type="submit">Anmelden</button>
</form>
<script>if(location.search.includes('f=1'))document.getElementById('err').style.display='block'</script>
</body></html>
